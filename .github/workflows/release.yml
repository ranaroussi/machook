name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (universal)
    # macos-15 ships Xcode 16.4 (Swift 6.1) by default. macos-14 only has up
    # to Xcode 16.2 (Swift 6.0) and is being deprecated in late 2026 anyway,
    # so we may as well jump now.
    #
    # One job, not an arch matrix: create-app-bundle.sh cross-compiles both
    # slices and lipos them into a single universal bundle. Sparkle's appcast
    # has no architecture filtering, so shipping one artifact is the only way
    # both Apple Silicon and Intel users can auto-update from one <enclosure>.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.x (Swift 6 toolchain)
        # Package.swift declares swift-tools-version: 6.0 — needs Xcode
        # 16.x. The macos-14 runner image's default is Xcode 15.4
        # (Swift 5.10), which trips `error: package is using Swift
        # tools version 6.0.0 but the installed version is 5.10.0`.
        #
        # Pick the highest Xcode_16* present so we ride the runner
        # image's upgrades automatically (today 16.2; tomorrow 16.3+).
        # macOS 14 runners are deprecating in late 2026 — at some
        # point we'll want to switch runs-on to macos-15, which ships
        # 16.x natively.
        run: |
          xcode_path=""
          for candidate in $(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -rV); do
            if [ -d "$candidate" ]; then
              xcode_path="$candidate"
              break
            fi
          done
          if [ -z "$xcode_path" ]; then
            echo "::error::No Xcode 16.x found on the runner. Available Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          sudo xcode-select -s "$xcode_path"
          echo "Selected: $xcode_path"

      - name: Show Swift version
        run: swift --version

      - name: Import code signing certificate
        if: env.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        env:
          APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' src/Info.plist)"
          echo "version=$VERSION"             >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER"   >> "$GITHUB_OUTPUT"

      # cloudflared is fetched by create-app-bundle.sh, which downloads both
      # macOS slices and lipos them. Doing it there rather than here keeps one
      # implementation for CI and local builds — the previous split had CI
      # writing to a path the bundler no longer reads, so the bundler silently
      # fell through to a download URL Cloudflare had already withdrawn.

      - name: Build universal .app bundle
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          TARGET_ARCH: universal
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          chmod +x create-app-bundle.sh
          ./create-app-bundle.sh

      - name: Verify universal slices
        # create-app-bundle.sh already fails on a thin binary; this repeats the
        # check as a release gate so a regression in the bundler can't quietly
        # ship a half-architecture build.
        run: |
          fail=0
          for bin in \
            "Machook.app/Contents/MacOS/Machook" \
            "Machook.app/Contents/Resources/cloudflared" \
            "Machook.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          do
            if [ ! -f "$bin" ]; then
              echo "::error::missing binary: $bin"; fail=1; continue
            fi
            archs="$(lipo -archs "$bin" 2>/dev/null || echo unknown)"
            echo "$bin → $archs"
            case "$archs" in
              *arm64*) ;;
              *) echo "::error::$bin is missing the arm64 slice ($archs)"; fail=1 ;;
            esac
            case "$archs" in
              *x86_64*) ;;
              *) echo "::error::$bin is missing the x86_64 slice ($archs)"; fail=1 ;;
            esac
          done
          exit $fail

      - name: Verify code signature (best effort)
        run: |
          codesign --verify --deep --strict --verbose=2 "Machook.app" || true
          spctl -a -vvv -t install "Machook.app" || echo "::warning::Gatekeeper assessment failed (expected without notarization)"

      - name: Notarize
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent "Machook.app" machook-notarize.zip
          xcrun notarytool submit machook-notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "Machook.app"
          xcrun stapler validate "Machook.app"
          rm machook-notarize.zip

      - name: Package ZIP
        # This ZIP is both the download link and the Sparkle enclosure, so its
        # name is referenced by the appcast job below.
        run: |
          ditto -c -k --sequesterRsrc --keepParent "Machook.app" "machook-universal.zip"
          shasum -a 256 "machook-universal.zip" > "machook-universal.zip.sha256"

      - name: Package DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Machook" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Machook.app" 175 120 \
            --hide-extension "Machook.app" \
            --app-drop-link 425 120 \
            "machook-universal.dmg" \
            "Machook.app" || true
          if [ -f "machook-universal.dmg" ]; then
            shasum -a 256 "machook-universal.dmg" > "machook-universal.dmg.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: machook-universal
          path: |
            machook-universal.zip
            machook-universal.zip.sha256
            machook-universal.dmg
            machook-universal.dmg.sha256
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -la release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Machook ${{ github.ref_name }}

            macOS menu bar app that runs shell commands on your Mac in response to incoming webhooks, exposed through a Cloudflare Tunnel and as MCP tools.

            ### Downloads

            One universal build runs on both Apple Silicon and Intel Macs. Requires macOS 14 or later.

            | Download | Contents |
            |----------|----------|
            | `machook-universal.dmg` | Drag-to-Applications installer |
            | `machook-universal.zip` | Same app, zipped (also what auto-update fetches) |

            ### Install

            1. Download either file — there's only one build, no architecture to pick.
            2. Mount the DMG (or unzip) and drag **Machook.app** to **Applications**.
            3. Open Settings from the menu bar icon, set a bearer token, and add your endpoints.
            4. Turn on the tunnel and point your webhook sender at the printed URL.

            No system permissions are required: Machook only listens on localhost and runs the commands you configure.

            ### Verification

            ```bash
            shasum -a 256 -c machook-universal.zip.sha256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  appcast:
    name: Update appcast.xml
    needs: release
    runs-on: macos-15
    # The `env` context isn't available in job-level `if:` conditions
    # (chicken-and-egg with the job's own `env:` block) and referencing
    # `secrets.X != ''` in an `if:` is also unreliable, so we let the
    # job always run on tag pushes and fail loudly in the first step
    # below if the Sparkle key isn't configured. That's the right
    # behavior: missing key on a tag push is a maintainer config error,
    # not an optional flow.
    if: startsWith(github.ref, 'refs/tags/')
    env:
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - name: Verify Sparkle private key is configured
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set."
            echo "::error::Generate a keypair with ./scripts/sparkle-keygen.sh and add both halves to:"
            echo "::error::  Repository Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::See docs/DISTRIBUTION.md § 1.1 for the full one-time setup."
            exit 1
          fi
          echo "Sparkle key length: ${#SPARKLE_ED_PRIVATE_KEY} chars — OK."

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve version + build number
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' src/Info.plist)"
          echo "version=$VERSION"             >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER"   >> "$GITHUB_OUTPUT"

      - name: Build Sparkle helpers (need sign_update binary)
        run: |
          cd src && swift build -c release --product Machook
          # The build produces Sparkle's bundle with sign_update inside.

      - name: Append release to appcast.xml
        run: |
          # Sparkle's <enclosure> is one-per-channel with no architecture
          # filtering, which is exactly why the build job ships a single
          # universal ZIP: this one URL is correct for every Mac that can run
          # the app. The signature is computed over that same ZIP, so the file
          # Sparkle downloads is byte-identical to the one published here.
          ZIP="$(find artifacts -name 'machook-universal.zip' | head -1)"
          if [ -z "$ZIP" ]; then
            echo "::error::machook-universal.zip not found in artifacts — nothing to sign."
            find artifacts -type f | head -20
            exit 1
          fi
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

          ./scripts/appcast-add.sh \
            --zip "$ZIP" \
            --version "${{ steps.meta.outputs.version }}" \
            --build "${{ steps.meta.outputs.build_number }}" \
            --download-url "$BASE_URL/machook-universal.zip" \
            --notes-url "$NOTES_URL"

      - name: Commit + push appcast.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet appcast.xml; then
            echo "appcast.xml unchanged — nothing to commit."
            exit 0
          fi
          git add appcast.xml
          git commit -m "chore(release): update appcast for ${{ github.ref_name }}"
          git push origin main
